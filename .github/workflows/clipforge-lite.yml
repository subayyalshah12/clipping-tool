name: Build ClipForge Lite installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clipforge-lite.yml"
      - "packaging/**"
      - "app/**"
      - "requirements.txt"
      - "web/**"
permissions:
  contents: write
concurrency:
  group: clipforge-lite-build
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        shell: pwsh
        run: |
          npm ci
          npm run build
          if (!(Test-Path "dist/index.html")) { throw "Frontend build missing" }
      - name: Build Lite CPU bundle
        shell: pwsh
        run: ./packaging/build_lite.ps1 -OutDir "$env:GITHUB_WORKSPACE\dist_lite"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\ClipForge-Lite.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Lite-Windows-Installer
          path: dist_installer/ClipForge-Lite-Setup-v1.0.0.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "dist_installer\\ClipForge-Lite-Setup-v1.0.0.exe" --title "ClipForge Lite $env:GITHUB_REF_NAME" --notes "Windows x64 CPU-optimized installer. Includes embedded Python, FFmpeg and Whisper Base INT8. No CUDA or paid API key."
